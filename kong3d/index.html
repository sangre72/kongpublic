<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kong3D — GUI Modeling Engine v0.1</title>
<style>
:root{
  --bg:#12141a; --panel:#1b1e27; --panel2:#232734; --line:#2e3342;
  --text:#e8eaf2; --muted:#9aa1b5; --accent:#7c6cff; --accent2:#4fd1c5;
  --danger:#ff6b81; --ok:#4fd18b; --warn:#ffb454;
  --radius:10px; --shadow:0 4px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,'SF Pro',Segoe UI,sans-serif; overflow:hidden}
#app{display:grid; grid-template-columns:56px 1fr 264px; grid-template-rows:44px 1fr; height:100vh}
header{grid-column:1/4; display:flex; align-items:center; gap:12px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line)}
header h1{font-size:15px; font-weight:700; letter-spacing:.3px}
header h1 .v{color:var(--accent2); font-weight:500; font-size:12px; margin-left:6px}
header .spacer{flex:1}
.btn{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px;
  padding:6px 12px; font-size:13px; cursor:pointer; transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:#2a2f40; border-color:#3d4356}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#6a5aef}
.btn.danger{color:var(--danger)}
#toolbar{grid-row:2; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 0; background:var(--panel); border-right:1px solid var(--line)}
.tool{width:40px; height:40px; display:grid; place-items:center; font-size:17px; background:var(--panel2);
  border:1px solid var(--line); border-radius:var(--radius); color:var(--text); cursor:pointer; transition:all .15s}
.tool:hover{background:#2a2f40}
.tool:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tool.active{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 12px rgba(124,108,255,.4)}
.tool-sep{width:28px; height:1px; background:var(--line); margin:4px 0}
#viewport{grid-row:2; position:relative; min-width:0}
#viewport canvas{display:block}
#hud{position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted);
  background:rgba(18,20,26,.72); padding:6px 10px; border-radius:8px; pointer-events:none}
#side{grid-row:2; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
#side h2{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); padding:12px 14px 6px}
#objlist{list-style:none; overflow-y:auto; flex:0 0 32%; padding:0 8px}
#objlist li{display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent}
#objlist li:hover{background:var(--panel2)}
#objlist li.sel{background:var(--panel2); border-color:var(--accent)}
#objlist li .dot{width:10px; height:10px; border-radius:50%; flex:none}
#objlist li .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#objlist li button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; border-radius:6px; padding:2px 5px}
#objlist li button:hover{color:var(--danger)}
#objlist li button:focus-visible{outline:2px solid var(--accent)}
#props{flex:1; overflow-y:auto; padding:4px 14px 14px; border-top:1px solid var(--line)}
.prow{display:grid; grid-template-columns:52px 1fr 1fr 1fr; gap:6px; align-items:center; margin:7px 0}
.prow label{font-size:12px; color:var(--muted)}
.prow input[type=number]{width:100%; min-w:0; background:var(--panel2); border:1px solid var(--line); color:var(--text);
  border-radius:6px; padding:5px 6px; font-size:12px}
.prow input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.prow.color{grid-template-columns:52px 1fr}
.prow input[type=color]{width:100%; height:30px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:2px; cursor:pointer}
#empty{color:var(--muted); font-size:12px; padding:10px 0}
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--panel2);
  border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 16px; font-size:13px;
  box-shadow:var(--shadow); opacity:0; transition:opacity .25s; pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
#playhud{position:absolute; inset:0; pointer-events:none}
#crosshair{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:22px; color:var(--accent2); text-shadow:0 0 6px rgba(79,209,197,.8)}
#playinfo{position:absolute; left:12px; top:10px; font:12px ui-monospace,monospace; color:var(--accent2);
  background:rgba(18,20,26,.72); padding:5px 9px; border-radius:8px}
#playhelp{position:absolute; right:12px; top:10px; font-size:12px; color:var(--muted);
  background:rgba(18,20,26,.72); padding:5px 9px; border-radius:8px}
body.playing #toolbar, body.playing #side{opacity:.35; pointer-events:none}
#score{position:absolute; left:50%; top:12px; transform:translateX(-50%); font:700 17px ui-monospace,monospace;
  color:var(--warn); background:rgba(18,20,26,.72); padding:6px 14px; border-radius:10px; letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐾 Kong3D<span class="v">v0.1</span></h1>
    <div class="spacer"></div>
    <button class="btn primary" id="btnPlay" aria-label="플레이 모드">▶ Play</button>
    <button class="btn" id="btnBgm" aria-label="배경음악 추가">🎵 BGM</button>
    <input type="file" id="bgmFile" accept="audio/*" hidden>
    <button class="btn" id="btnSpawn" aria-label="스폰 지점 설정">⚑ Spawn</button>
    <button class="btn" id="btnRef" aria-label="참조 이미지 토글">🖼 Ref</button>
    <button class="btn" id="viewSide" aria-label="측면 뷰">Side</button>
    <button class="btn" id="viewFront" aria-label="정면 뷰">Front</button>
    <button class="btn" id="viewTop" aria-label="상단 뷰">Top</button>
    <button class="btn" id="viewQuarter" aria-label="쿼터 뷰">3/4</button>
    <button class="btn" id="btnSave" aria-label="장면 저장">💾 Save</button>
    <button class="btn" id="btnLoad" aria-label="장면 불러오기">📂 Load</button>
    <button class="btn" id="btnExport" aria-label="JSON 내보내기">⬇ Export</button>
    <button class="btn danger" id="btnClear" aria-label="장면 비우기">🗑 Clear</button>
  </header>

  <nav id="toolbar" aria-label="도구">
    <button class="tool" id="addBox"    title="Box 추가 (1)"      aria-label="박스 추가">◻</button>
    <button class="tool" id="addCyl"    title="Cylinder 추가 (2)" aria-label="원기둥 추가">⬤</button>
    <button class="tool" id="addSphere" title="Sphere 추가 (3)"   aria-label="구 추가">●</button>
    <button class="tool" id="addPlane"  title="Plane 추가 (4)"    aria-label="평면 추가">▭</button>
    <div class="tool-sep" role="separator"></div>
    <button class="tool" id="entPlatform" title="발판 추가" aria-label="발판 추가">▬</button>
    <button class="tool" id="entLadder"   title="사다리 추가" aria-label="사다리 추가">≡</button>
    <button class="tool" id="entFruit"    title="과일 추가" aria-label="과일 추가">🍎</button>
    <button class="tool" id="entSnake"    title="뱀 추가" aria-label="뱀 추가">🐍</button>
    <button class="tool" id="entSpawn"    title="스폰 지점" aria-label="스폰 배치">⚑</button>
    <div class="tool-sep" role="separator"></div>
    <button class="tool" id="curveDraw"   title="곡선 그리기 (클릭=점, Enter=압출)" aria-label="곡선 그리기">✎</button>
    <button class="tool" id="curveCorner" title="모서리 점 모드" aria-label="모서리 점 모드">∠</button>
    <button class="tool" id="curveDone"   title="곡선→압출 완성" aria-label="곡선 압출 완성">✔</button>
    <button class="tool" id="curveLathe"  title="곡선→회전체 완성" aria-label="곡선 회전체 완성">◔</button>
    <div class="tool-sep" role="separator"></div>
    <button class="tool active" id="modeMove"   title="이동 (G)"   aria-label="이동 모드">✥</button>
    <button class="tool" id="modeRotate" title="회전 (R)"   aria-label="회전 모드">↻</button>
    <button class="tool" id="modeScale"  title="크기 (S)"   aria-label="크기 모드">⤢</button>
  </nav>

  <main id="viewport">
    <div id="hud">LMB select · drag gizmo · RMB orbit · wheel zoom · G/R/S mode · Del delete · P play</div>
    <div id="playhud" hidden>
      <div id="crosshair">+</div>
      <div id="playinfo">pos 0,0,0</div>
      <div id="score">SCORE 0</div>
      <div id="playhelp">WASD move · Space jump · Click shoot · Esc exit</div>
    </div>
  </main>

  <aside id="side">
    <h2>Objects</h2>
    <ul id="objlist" aria-label="객체 목록"></ul>
    <h2>Properties</h2>
    <div id="props"><div id="empty">no selection</div></div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js",
               "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js",
               "three/addons/controls/TransformControls.js": "./lib/TransformControls.js" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
