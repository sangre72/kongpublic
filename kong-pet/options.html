<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KongPet 설정</title>
<style>
  :root{--bg:#fff7f0;--card:#fff;--accent:#ff8a5b;--accent2:#ffd54f;--ink:#3a2e2a;--muted:#9a8b84;--ok:#2e9e5b;--err:#d64545;}
  *{box-sizing:border-box}
  body{font-family:"Apple SD Gothic Neo",-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--ink);padding:32px;}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:26px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 24px}
  .card{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(255,138,91,.12);padding:22px;margin-bottom:20px}
  label{font-weight:600;display:block;margin:0 0 8px}
  input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid #f0dccd;border-radius:12px;font-size:14px;background:#fffdfb}
  input:focus{outline:none;border-color:var(--accent)}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
  button{border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  .primary{background:var(--accent);color:#fff}.primary:hover{background:#ff764a}
  .primary:disabled{background:#f2c9b6;cursor:not-allowed}
  .ghost{background:#fff0e8;color:var(--accent)}
  .species.sel{background:var(--accent);color:#fff}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:16px}
  .opt{background:#fffdfb;border:2.5px solid #f0dccd;border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,138,91,.18)}
  .opt img{width:100%;border-radius:10px;aspect-ratio:1;object-fit:contain;background:#fbf3ec}
  .opt .lbl{margin-top:8px;font-weight:600;font-size:13px}
  .status{margin-top:14px;font-size:14px;min-height:20px}
  .status.ok{color:var(--ok)}.status.err{color:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 KongPet</h1>
  <p class="sub">종을 고르면 귀여운 캐릭터가 브라우저에 상주해요. (AI 사진 분석 없이 바로 사용)</p>

  <div class="card">
    <label>동물 종류를 고르세요</label>
    <div class="row" id="speciesSel">
      <button class="ghost species" data-sp="dog">🐶 강아지</button>
      <button class="ghost species" data-sp="cat">🐱 고양이</button>
      <button class="ghost species" data-sp="fish">🐠 물고기</button>
    </div>
    <div id="preview" class="grid"></div>
    <label style="margin-top:16px" id="bgLabel">배경 장면 (16:9)</label>
    <div id="bgPreview" class="grid"></div>
    <label style="margin-top:16px" for="petName">펫 이름</label>
    <input type="text" id="petName" placeholder="예: 콩이">
    <div class="row" style="margin-top:16px">
      <button class="primary" id="apply" disabled>이 캐릭터로 결정</button>
      <span id="applyStatus" class="status"></span>
    </div>
  </div>

  <div class="card">
    <label>쿠팡파트너스 API 키 <span style="font-weight:400;color:var(--muted)">(선택 — 추천 용품 위젯용)</span></label>
    <input type="password" id="coupangAccessKey" placeholder="Coupang Access Key">
    <input type="password" id="coupangSecretKey" placeholder="Coupang Secret Key" style="margin-top:8px">
    <div class="hint">쿠팡파트너스 → 도구 → Partners API 에서 발급. 없으면 추천 위젯만 비활성.</div>
    <div class="row" style="margin-top:14px">
      <button class="ghost" id="saveKey">키 저장</button>
      <span id="keyStatus" class="status"></span>
    </div>
  </div>

  <div class="card" id="currentCard" style="display:none">
    <label>현재 상주 캐릭터</label>
    <div class="row">
      <img id="currentAvatar" style="width:120px;border-radius:14px;border:2px solid #f0dccd">
      <div><div id="currentName" style="font-weight:700;font-size:18px"></div>
      <div class="hint">모든 페이지 우측 하단에 나타납니다. 클릭하면 반응해요.</div></div>
    </div>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
