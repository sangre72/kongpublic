[package]
name = "kongtrol"
version = "0.1.0"
edition = "2024"
description = "Cross-platform OS control CLI (processes, services, schedulers, apps, input)"
license-file = "../LICENSE"

[dependencies]
clap = { version = "4", features = ["derive"] }
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
comfy-table = "8"
tracing = "0.1"
tracing-subscriber = "0.3"
# M7 perception-decision-loop (ADR 0007): 화면 캡처·픽셀·입력 주입
xcap = "0.9"
image = "0.25"
enigo = "0.6"
# ★로컬 VL 서버 연동(a_922/934): 스샷→로컬LLM(192.168.45.183:8000) 판단 위임, unlabeled 보조수단
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
# ★직접 CGEvent 클릭(macOS): enigo button 이 일부 앱 canvas 에 클릭 미전달(이동은 전달됨) →
#   순수 LeftMouseDown/Up 이벤트를 직접 posting. core-graphics 는 enigo 전이의존이라 새 다운로드 없음.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
# ★a11y grounding(a_21 PhaseA): macOS AXUIElement 접근성트리 덤프 → 요소 좌표 <100ms.
#   비전 스샷루프(2~5s/step) 벽을 구조화 트리로 돌파(a_20 리서치 추천1).
accessibility-sys = "0.1"
core-foundation = "0.10"
