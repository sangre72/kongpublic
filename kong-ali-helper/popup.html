<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 260px;
    font-family: -apple-system, system-ui, sans-serif;
    background: #1c1c1e; color: #f2f2f7;
  }
  .kah-pop-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 14px 8px;
  }
  .kah-pop-logo { width: 28px; height: 28px; border-radius: 7px; }
  .kah-pop-title { font-size: 15px; font-weight: 700; }
  .kah-pop-sub { padding: 0 14px 10px; font-size: 11px; color: #aeaeb2; line-height: 1.5; }
  .kah-pop-feats { padding: 0 14px 12px; font-size: 11px; color: #d1d1d6; line-height: 1.7; }
  .kah-pop-feats b { color: #f2f2f7; }
  .kah-pop-donate {
    display: block; margin: 0 14px 14px; padding: 9px 12px;
    text-align: center; text-decoration: none;
    background: #ffdd00; color: #1c1c1e;
    border-radius: 8px; font-size: 13px; font-weight: 700;
    transition: filter .12s;
  }
  .kah-pop-donate:hover { filter: brightness(0.94); }
  .kah-pop-foot { padding: 0 14px 12px; font-size: 10px; color: #8e8e93; }
</style>
</head>
<body>
  <div class="kah-pop-head">
    <img class="kah-pop-logo" src="icons/icon48.png" alt="AliKong">
    <span class="kah-pop-title">AliKong</span>
  </div>
  <div class="kah-pop-sub">알리익스프레스 쇼핑 도우미. 백엔드·계정·추적 없이 브라우저에서만 동작합니다.</div>
  <div class="kah-pop-feats">
    · <b>가격안전 신호등</b> — 상품 페이지 배지<br>
    · <b>쿠폰 자동적용</b> — 결제화면 코드 시도<br>
    · <b>배송현황 카드</b> — 홈에서 하루 1회
  </div>
  <a class="kah-pop-donate" href="https://buymeacoffee.com/panichill" target="_blank" rel="noopener noreferrer">☕ 개발자에게 커피 한 잔</a>
  <div class="kah-pop-foot">무료로 제공되며, 선택적 후원으로 운영됩니다.</div>
</body>
</html>
